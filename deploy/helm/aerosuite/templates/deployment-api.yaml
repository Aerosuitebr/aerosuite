apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerosuite.fullname" . }}-api
  labels:
    {{- include "aerosuite.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "aerosuite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aerosuite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if not .Values.metrics.serviceMonitor.enabled }}
      annotations:
        {{- toYaml .Values.metrics.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          {{- if .Values.api.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          {{- end }}
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
