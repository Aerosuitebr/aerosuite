# Exemplo — NÃO aplicar com valores reais no Git.
# Preferir: kubectl create secret generic ... (ver docs/HELM-STAGING-K8S.md)
apiVersion: v1
kind: Secret
metadata:
  name: aerosuite-staging-api-env
  namespace: aerosuite-staging
type: Opaque
stringData:
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:mysql://mysql-staging:3306/aerosuite?useSSL=false&serverTimezone=America/Sao_Paulo"
  QUARKUS_DATASOURCE_USERNAME: "aerosuite"
  QUARKUS_DATASOURCE_PASSWORD: "CHANGE_ME"
  AERO_SUITE_JWT_SECRET: "CHANGE_ME_MIN_32_CHARACTERS_LONG"
  FRONTEND_URL: "https://staging.aerosuite.app"
  MAIL_MOCK: "true"
