# CI — push em desenv: build + testes + a11y + deploy Vultr.
name: CI

on:
  push:
    branches: [main, master, develop, desenv, saas/**]
  pull_request:
    branches: [main, master, develop, desenv]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -B -e verify
          else
            mvn -B -e test
          fi
      - name: Upload JaCoCo coverage report
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend (build + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm run test:unit

  menu-i18n-audit:
    name: Menu i18n audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit menu keys (static + SQL)
        shell: pwsh
        run: ./scripts/test/audit-menu-i18n.ps1 -SkipApi

  a11y:
    name: A11y (axe + flows)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: A11y axe smoke (WCAG 2.x)
        run: npm run a11y:axe
      - name: A11y flow P0 (F1 F4 F6 F12)
        run: npm run a11y:flow-p0
      - name: A11y flow full (F1–F12)
        env:
          A11Y_FLOW_SCOPE: full
        run: npm run a11y:flow-full

  deploy-vultr:
    name: Deploy Vultr production
    runs-on: ubuntu-latest
    needs: [backend, frontend, menu-i18n-audit, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/desenv'
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Bundle repository
        run: |
          tar -czf /tmp/aerosuite-repo.tgz \
            --exclude=./node_modules \
            --exclude=./frontend/node_modules \
            --exclude=./backend/target \
            --exclude=./.git \
            --exclude=./.cursor \
            --exclude=./dist \
            --exclude=./frontend/dist \
            --exclude=./.env \
            --exclude=./.env.production \
            --exclude=./tmp \
            .

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERRO: configure o secret VULTR_SSH_PRIVATE_KEY no repositório."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/vultr_deploy
          chmod 600 ~/.ssh/vultr_deploy

      - name: Upload and deploy
        env:
          VULTR_HOST: ${{ vars.VULTR_HOST }}
          VULTR_SSH_USER: ${{ vars.VULTR_SSH_USER || 'root' }}
        run: |
          if [ -z "${VULTR_HOST}" ]; then
            echo "ERRO: configure a variable VULTR_HOST (IP do Vultr)."
            exit 1
          fi
          SSH_OPTS="-i ~/.ssh/vultr_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          scp ${SSH_OPTS} /tmp/aerosuite-repo.tgz "${VULTR_SSH_USER}@${VULTR_HOST}:/tmp/aerosuite-repo.tgz"
          scp ${SSH_OPTS} scripts/deploy/vultr-deploy.sh "${VULTR_SSH_USER}@${VULTR_HOST}:/tmp/vultr-deploy.sh"
          ssh ${SSH_OPTS} "${VULTR_SSH_USER}@${VULTR_HOST}" "chmod +x /tmp/vultr-deploy.sh && INSTALL_DIR=/opt/aerosuite TARBALL=/tmp/aerosuite-repo.tgz bash /tmp/vultr-deploy.sh"

      - name: Smoke public URL
        env:
          VULTR_PUBLIC_URL: ${{ vars.VULTR_PUBLIC_URL || 'https://prod.aerosuite.com.br' }}
        run: |
          curl -sfI "${VULTR_PUBLIC_URL}/" | head -3
          curl -sf "${VULTR_PUBLIC_URL}/api/public/deployment" | head -c 200

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend, menu-i18n-audit]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        env:
          AEROSUITE_WEB_URL: ${{ vars.AEROSUITE_WEB_URL }}
          AEROSUITE_TEST_EMAIL: ${{ secrets.AEROSUITE_TEST_EMAIL }}
          AEROSUITE_TEST_PASSWORD: ${{ secrets.AEROSUITE_TEST_PASSWORD }}
          AEROSUITE_TEST_TENANT: ${{ secrets.AEROSUITE_TEST_TENANT }}
        run: |
          if [ -z "$AEROSUITE_TEST_PASSWORD" ]; then
            echo "Secrets E2E em falta — a ignorar."
            exit 0
          fi
          npm test
