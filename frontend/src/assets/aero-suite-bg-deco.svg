<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Centro reservado ao conte�do: decora��o s� nas bordas -->
    <mask id="edgeOnly" maskUnits="userSpaceOnUse">
      <rect width="1600" height="900" fill="white"/>
      <ellipse cx="798" cy="438" rx="540" ry="400" fill="black"/>
    </mask>

    <linearGradient id="edgeGlowL" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGlowR" gradientUnits="objectBoundingBox" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGlowB" gradientUnits="objectBoundingBox" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.11"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="haloTR" gradientUnits="userSpaceOnUse" cx="1480" cy="72" r="420">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBL" gradientUnits="userSpaceOnUse" cx="110" cy="820" r="380">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halos grandes (fora da m�scara tamb�m ok, mas aplicamos mask no grupo principal) -->
  <g mask="url(#edgeOnly)">
    <rect width="520" height="900" fill="url(#edgeGlowL)"/>
    <rect x="1080" width="520" height="900" fill="url(#edgeGlowR)"/>
    <rect y="620" width="1600" height="280" fill="url(#edgeGlowB)"/>
    <rect width="1600" height="900" fill="url(#haloTR)"/>
    <rect width="1600" height="900" fill="url(#haloBL)"/>

    <!-- Arco de rota (impacto, tra�o limpo) -->
    <path
      fill="none"
      stroke="#0ea5e9"
      stroke-width="2.4"
      stroke-linecap="round"
      opacity="0.22"
      d="M-120 320 C 220 40, 520 -20, 900 120 S 1520 200, 1720 40"/>

    <path
      fill="none"
      stroke="#64748b"
      stroke-width="1.4"
      stroke-dasharray="14 22"
      stroke-linecap="round"
      opacity="0.2"
      d="M40 780 C 280 520, 520 620, 820 500 S 1380 360, 1580 420"/>

    <!-- Faixa vertical �instrumentos� (esquerda) -->
    <g opacity="0.28" stroke="#475569" stroke-width="1.1" fill="none">
      <path d="M72 120v640"/>
      <path d="M112 180v520"/>
      <path d="M72 260h40M72 420h40M72 580h40M72 680h40"/>
      <circle cx="92" cy="200" r="5" fill="#0ea5e9" fill-opacity="0.35" stroke="none"/>
      <circle cx="92" cy="360" r="5" fill="#0ea5e9" fill-opacity="0.28" stroke="none"/>
      <circle cx="92" cy="520" r="5" fill="#0ea5e9" fill-opacity="0.22" stroke="none"/>
    </g>

    <!-- Silhueta lateral grande (direita), s� tra�o -->
    <g transform="translate(1080 260) rotate(-6)" opacity="0.2" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round">
      <path d="M0 280 L140 276 L280 262 L420 248 L520 232 L620 228 L720 238 L800 258 L860 288 L900 318 L920 340 L900 362 L820 372 L620 378 L380 372 L140 360 Z"/>
      <path d="M520 232 L548 120 L572 116 L598 236"/>
      <path d="M280 262 L302 310 L328 314 L352 268"/>
      <path d="M620 228 L642 318 L668 322 L696 232"/>
    </g>

    <!-- Turbina estilizada (canto inferior direito) -->
    <g transform="translate(1340 640)" opacity="0.18" fill="none" stroke="#475569" stroke-width="1.5">
      <circle cx="0" cy="0" r="118"/>
      <circle cx="0" cy="0" r="76"/>
      <circle cx="0" cy="0" r="34"/>
      <path d="M0-128 L0 128M-110-40 L110 40M-110 40 L110-40" stroke-width="1.15"/>
    </g>

    <!-- Perfil de asa grande (canto superior esquerdo) -->
    <g transform="translate(-40 40)" opacity="0.18" fill="none" stroke="#0ea5e9" stroke-width="1.8">
      <path d="M120 200 Q 280 175, 420 210 Q 360 268, 200 252 Q 140 230, 120 200Z"/>
      <path d="M200 228 Q 300 248, 380 232" stroke="#64748b" stroke-width="1" opacity="0.9"/>
    </g>

    <!-- Grelha macro s� nas zonas laterais (n�o no centro) -->
    <g opacity="0.16" stroke="#94a3b8" stroke-width="0.85" fill="none">
      <path d="M0 140h320M0 240h300M0 340h280M0 660h340M0 760h360"/>
      <path d="M1280 100h320M1300 200h300M1320 300h280M1260 500h340M1240 600h360"/>
