# Configuração de log reduzida
access_log off;
error_log /var/log/nginx/error.log warn;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  text/javascript
  application/xml
  image/svg+xml;

server {
  listen 80;
  server_name _;
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html;

  # Modo manutenção: criar ficheiro vazio em /etc/nginx/maintenance/on (volume data/nginx-maintenance).
  error_page 503 /maintenance.html;

  location = /maintenance.html {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Retry-After 120 always;
  }

  # Evita 400 "Request Header Or Cookie Too Large" (muitos cookies, JWT longo, etc.)
  client_header_buffer_size 16k;
  large_client_header_buffers 4 64k;

  # Predefinição do nginx é 1m — uploads multipart (foto de perfil, anexos) falhavam acima disso (HTTP 413).
  client_max_body_size 25M;

  # Desabilitar logs de acesso para assets estáticos (não interceptar /api/*.jpg — fotos de perfil, etc.)
  location ~* ^/(?!api/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # SPA shell: nunca cache longo — senão o browser mantém index antigo apontando para hashes antigos,
  # ou emparelha mal runtime/chunks após deploy (erro webpack .call / tela branca).
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  # Docker Compose: serviço "api" expõe Quarkus na 8080 *dentro* da rede.
  # NÃO usar host:8081 — no compose 8081:80 é o próprio frontend (loop → 502).
  location ^~ /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Accept-Charset "utf-8";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User-Id $http_x_user_id;
    proxy_set_header X-User-Name $http_x_user_name;
    proxy_set_header X-User-Email $http_x_user_email;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Compat: pedidos a /auth/* → /api/auth/* no Quarkus
  location ^~ /auth/ {
    proxy_pass http://api:8080/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  location / {
    if (-f /etc/nginx/maintenance/on) {
      return 503;
    }
    try_files $uri $uri/ /index.html;
  }
}
