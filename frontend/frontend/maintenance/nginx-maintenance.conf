access_log off;
error_log /var/log/nginx/error.log warn;

server {
  listen 80;
  server_name _;
  charset utf-8;
  root /usr/share/nginx/html;

  error_page 503 /index.html;

  location /assets/ {
    try_files $uri =404;
    access_log off;
  }

  location / {
    return 503;
  }

  location = /index.html {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Retry-After 120 always;
  }
}
