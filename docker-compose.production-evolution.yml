# Evolution API em produção (mesmo host Docker que a API Aero Suite).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local-mysql.yml \
#     -f docker-compose.production.yml -f docker-compose.production-evolution.yml up -d --build
#
# Defina em .env.production:
#   EVOLUTION_API_KEY=<segredo-forte>
#   AERO_SUITE_EVOLUTION_WEBHOOK_BASE_URL=https://api.seudominio.com
#   AERO_SUITE_EVOLUTION_API_BASE_URL=http://evolution-api:8080

services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: aerosuite-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?EVOLUTION_POSTGRES_PASSWORD obrigatório}
      POSTGRES_DB: evolution
    volumes:
      - ${AEROSUITE_DATA_ROOT:-/var/aerosuite}/evolution-postgres:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: aerosuite-evolution-redis
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: aerosuite-evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      SERVER_URL: ${AERO_SUITE_EVOLUTION_PUBLIC_URL:-http://localhost:18082}
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY obrigatório}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_PHONE_VERSION:-2.3000.1025062854}
    volumes:
      - ${AEROSUITE_DATA_ROOT:-/var/aerosuite}/evolution-instances:/evolution/instances

  api:
    depends_on:
      - evolution-api
    environment:
      WHATSAPP_API_ENABLED: "true"
      AERO_SUITE_EVOLUTION_ENABLED: "true"
      AERO_SUITE_EVOLUTION_API_BASE_URL: http://evolution-api:8080
      AERO_SUITE_EVOLUTION_ADMIN_API_KEY: ${EVOLUTION_API_KEY}
      AERO_SUITE_EVOLUTION_WEBHOOK_BASE_URL: ${AERO_SUITE_EVOLUTION_WEBHOOK_BASE_URL:?AERO_SUITE_EVOLUTION_WEBHOOK_BASE_URL obrigatório}
      WHATSAPP_API_URL: http://evolution-api:8080
      WHATSAPP_API_TOKEN: ${EVOLUTION_API_KEY}
