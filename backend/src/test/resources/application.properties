# Perfil de teste — H2 em memória; JWT obrigatório nos endpoints de conformidade.

# Porta aleatória (evita conflito com Docker frontend em :8081 ou API em :8080).
quarkus.http.port=0
quarkus.http.test-port=0

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:conformidade-it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# H2 não aceita SET NAMES do application.properties principal (MySQL).
quarkus.datasource.jdbc.new-connection-sql=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.enabled=false

quarkus.hibernate-orm.multitenant=DISCRIMINATOR

aero.suite.auth.require-jwt=true
aero.suite.auth.jwt.secret=test-secret-minimum-32-characters-long-for-hs256

quarkus.log.level=WARN
quarkus.log.category."com.aerosuite".level=INFO
