quarkus.datasource.db-kind=mysql
# Em execução local (JAR/dev na máquina): localhost. Com API no Docker, defina QUARKUS_DATASOURCE_JDBC_URL (ex.: host.docker.internal).
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/aerosuite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:root}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:root}
# Garante UTF-8 mesmo se QUARKUS_DATASOURCE_JDBC_URL no .env omitir estes parâmetros
quarkus.datasource.jdbc.additional-jdbc-properties.useUnicode=true
quarkus.datasource.jdbc.additional-jdbc-properties.characterEncoding=UTF-8
quarkus.datasource.jdbc.additional-jdbc-properties.connectionCollation=utf8mb4_unicode_ci
quarkus.datasource.jdbc.new-connection-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.hibernate-orm.unsupported-properties."hibernate.query.plan_cache_max_size"=2048
quarkus.hibernate-orm.fetch.batch-size=32
quarkus.hibernate-orm.jdbc.statement-batch-size=32
# Chat só texto: API /api/chamadas bloqueada (sem polling WebRTC no servidor)
aero.suite.chat.voice-calls-enabled=${AERO_SUITE_CHAT_VOICE_CALLS_ENABLED:false}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false

quarkus.http.port=8080

# Proxy reverso (Cloudflare / Nginx): confiar em X-Forwarded-* para HTTPS e host corretos
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
# Proxies confiáveis: localhost e redes internas (Nginx/Docker). Se o backend receber direto do Cloudflare, adicione os IPs do Cloudflare.
quarkus.http.proxy.trusted-proxies=127.0.0.1,172.16.0.0/12,10.0.0.0/8

# Caminhos e segredos da aplicação (identidade comercial: Aero Suite). Variáveis de ambiente: prefixo AERO_SUITE_*.
# Relativo à raiz do repositório (pasta manuals/ ao lado de backend/ e frontend/)
aero.suite.manuals.path=${AERO_SUITE_MANUALS_PATH:manuals}
# Pasta de referência no Windows (histórico legado /app/backup, mensagens). Em Docker: AERO_SUITE_BACKUP_HOST_EXPLORER_FOLDER.
aero.suite.backup.host-explorer-folder=${AERO_SUITE_BACKUP_HOST_EXPLORER_FOLDER:D:/Backup/BD}
aero.suite.biblioteca.path=${AERO_SUITE_BIBLIOTECA_PATH:./biblioteca}
# Vídeos da vitrine comercial (pasta na raiz do repositório, ao lado de backend/ e frontend/)
aero.suite.vitrine.path=${AERO_SUITE_VITRINE_PATH:./vitrine-videos}

# White-label / proposta comercial (e-mail, PDF, WhatsApp). Alinhe ao frontend (branding.json) por ambiente.
# Quando o assistente grava em BD (tabela sistema_empresa_config, Flyway V6+), o backend usa esses dados e ignora estes valores para a marca ativa.
aero.suite.commercial.display-name=${AERO_SUITE_COMMERCIAL_DISPLAY_NAME:Aero Suite}
aero.suite.commercial.tagline=${AERO_SUITE_COMMERCIAL_TAGLINE:Plataforma de gestão para oficinas MRO}
aero.suite.commercial.email-subject-suffix=${AERO_SUITE_COMMERCIAL_EMAIL_SUBJECT_SUFFIX:Aero Suite}
aero.suite.commercial.support-email=${AERO_SUITE_COMMERCIAL_SUPPORT_EMAIL:contato@seudominio.com}
# Ficheiros de logo/wordmark enviados pelo painel da empresa (servidos em /api/public/empresa-asset/*).
aero.suite.empresa-assets.dir=${AERO_SUITE_EMPRESA_ASSETS_DIR:empresa-assets}
aero.suite.usuario-foto.dir=${AERO_SUITE_USUARIO_FOTO_DIR:data/uploads/usuarios}

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

quarkus.http.cors=false

quarkus.log.console.json=false
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.jboss".level=WARN
quarkus.log.category."io.agroal".level=WARN
quarkus.log.category."com.aerosuite.service.PropostaComercialService".level=INFO
quarkus.log.category."com.aerosuite.service.EstoqueService".level=INFO
quarkus.log.category."com.aerosuite.api.EstoqueResource".level=INFO
quarkus.log.category."com.aerosuite.service.EmailService".level=INFO
quarkus.log.category."com.aerosuite.service.WhatsAppService".level=WARN
quarkus.log.category."com.aerosuite.service.AuthService".level=INFO
quarkus.log.category."com.aerosuite.api.AuthResource".level=WARN
quarkus.log.category."com.aerosuite.api.AuthExternoResource".level=WARN
quarkus.log.category."com.aerosuite.security".level=WARN

# ========== Observabilidade (P2) — Prometheus + OTel opcional ==========
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
# OpenTelemetry (desligado por omissão; ligar com AERO_SUITE_OTEL_ENABLED=true + collector OTLP)
quarkus.otel.enabled=${AERO_SUITE_OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${AERO_SUITE_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.name=aerosuite-api,service.version=${app.version}

# API pública — rate limit por IP (memória local; ver docs/P2-ENTERPRISE-EXECUCAO.md)
aero.suite.public-api.rate-limit.enabled=${AERO_SUITE_PUBLIC_API_RATE_LIMIT_ENABLED:true}
aero.suite.public-api.rate-limit.requests-per-minute=${AERO_SUITE_PUBLIC_API_RATE_LIMIT_RPM:120}

quarkus.log.category."io.quarkus.http".level=WARN

quarkus.http.limits.max-body-size=500M
quarkus.http.limits.max-form-attribute-size=500M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=${java.io.tmpdir}
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.read-timeout=600S
quarkus.http.idle-timeout=600S

# ========== EMAIL / GOOGLE WORKSPACE ==========
# Conta SMTP: contato@aerosuite.com.br (senha de app). Remetente padrão: alias noreply@aerosuite.com.br
quarkus.mailer.from=${QUARKUS_MAILER_FROM:noreply@aerosuite.com.br}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:contato@aerosuite.com.br}
# Senha de app Google; definir QUARKUS_MAILER_PASSWORD no .env (nunca commitar).
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
quarkus.mailer.ssl=${QUARKUS_MAILER_SSL:false}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.auth-methods=${QUARKUS_MAILER_AUTH_METHODS:PLAIN}
quarkus.mailer.mock=${MAIL_MOCK:false}

suporte.responsavel.email=${SUPORTE_RESPONSAVEL_EMAIL:wellemlyra@gmail.com}
suporte.responsavel.locale=${SUPORTE_RESPONSAVEL_LOCALE:pt-BR}

# URL do frontend para links em emails (usuário externo: definir senha, etc.)
# Pode sobrescrever com variável de ambiente FRONTEND_URL
frontend.url=${FRONTEND_URL:https://app.aerosuite.app}

app.version=1.0.0

chat.upload.path=${CHAT_UPLOAD_PATH:./chat_uploads}

whatsapp.api.enabled=${WHATSAPP_API_ENABLED:false}
whatsapp.api.provider=${WHATSAPP_API_PROVIDER:evolution}
whatsapp.api.url=${WHATSAPP_API_URL:none}
whatsapp.api.instance=${WHATSAPP_API_INSTANCE:default}
whatsapp.api.token=${WHATSAPP_API_TOKEN:none}

# Evolution API — WhatsApp multi-tenant (instância dedicada por oficina)
aero.suite.evolution.enabled=${AERO_SUITE_EVOLUTION_ENABLED:${WHATSAPP_API_ENABLED:false}}
aero.suite.evolution.api-base-url=${AERO_SUITE_EVOLUTION_API_BASE_URL:${WHATSAPP_API_URL:none}}
aero.suite.evolution.admin-api-key=${AERO_SUITE_EVOLUTION_ADMIN_API_KEY:${WHATSAPP_API_TOKEN:none}}
# URL pública do backend (sem path) — ex.: https://api.aerosuite.app
aero.suite.evolution.webhook-base-url=${AERO_SUITE_EVOLUTION_WEBHOOK_BASE_URL:none}
aero.suite.evolution.sync.enabled=${AERO_SUITE_EVOLUTION_SYNC_ENABLED:true}

# Contato comercial público: sessão efêmera, destino fixo e desconexão após um envio.
aero.suite.marketing-whatsapp.enabled=${AERO_SUITE_MARKETING_WHATSAPP_ENABLED:false}
aero.suite.marketing-whatsapp.destination-phone=${AERO_SUITE_MARKETING_WHATSAPP_DESTINATION_PHONE:none}
aero.suite.evolution.connection-sync.enabled=${AERO_SUITE_EVOLUTION_CONNECTION_SYNC_ENABLED:true}

github.enabled=${GITHUB_ENABLED:true}
github.owner=${GITHUB_OWNER:}
github.repo=${GITHUB_REPO:}
github.token=${GITHUB_TOKEN:}
github.use-releases=${GITHUB_USE_RELEASES:true}

# --- Flyway (P0 plano comercial: migrações versionadas) ---
# BD legado: baseline marca versão 1; migrações reais começam em V2__*.sql
quarkus.flyway.migrate-at-start=true
# Repair antes de migrate: remove entradas falhadas no histórico e realinha checksums se o script
# versionado foi corrigido no repositório (evita arranque preso após migração a meio).
# Em auditoria estrita pode desactivar: QUARKUS_FLYWAY_REPAIR_AT_START=false
quarkus.flyway.repair-at-start=${QUARKUS_FLYWAY_REPAIR_AT_START:true}
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=Schema legado anterior ao Flyway
%test.quarkus.flyway.enabled=false

# Multi-tenant DISCRIMINATOR: @TenantId em String (tenant_id BIGINT); TenantResolver devolve String. HQL: :filterTid, nunca :tenantId. Usuario usa orgTenantId.
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
%test.quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# --- Auth interno (JWT HS256 + BCrypt, produto Aero Suite) ---
aero.suite.auth.jwt.secret=${AERO_SUITE_JWT_SECRET:dev-only-secret-change-in-production-min-32chars}
aero.suite.auth.require-jwt=true
# Token interno Base64 reversível (pré-JWT HS256). Manter false salvo rollback temporário.
aero.suite.auth.allow-legacy-internal-base64=${AERO_SUITE_ALLOW_LEGACY_INTERNAL_BASE64:false}
%test.aero.suite.auth.require-jwt=false
%test.aero.suite.public-api.rate-limit.enabled=false

# --- Autorização (RBAC por funcionalidade / perfil) ---
# Perfis cujo codigo ignora verificação de funcionalidade (acesso total à API anotada).
aero.suite.security.super-perfil-codigos=${AERO_SUITE_SECURITY_SUPER_PERFIL_CODIGOS:ADMIN,ADMINISTRADOR,DIRETOR}
# Delegação: tabela usuario_delegacao_funcionalidade (Flyway V3).
aero.suite.security.delegacao.enabled=${AERO_SUITE_SECURITY_DELEGACAO_ENABLED:true}

# --- P1: signup trial, billing mock, LGPD ---
aero.suite.signup.public-enabled=${AERO_SUITE_SIGNUP_PUBLIC_ENABLED:true}
aero.suite.billing.trial-days=${AERO_SUITE_BILLING_TRIAL_DAYS:7}
aero.suite.billing.provider=${AERO_SUITE_BILLING_PROVIDER:mock}
aero.suite.billing.stripe.secret-key=${AERO_SUITE_STRIPE_SECRET_KEY:}
aero.suite.billing.stripe.webhook-secret=${AERO_SUITE_STRIPE_WEBHOOK_SECRET:}
aero.suite.billing.stripe.price-id=${AERO_SUITE_STRIPE_PRICE_ID:}
aero.suite.billing.stripe.success-url=${AERO_SUITE_STRIPE_SUCCESS_URL:}
aero.suite.billing.stripe.cancel-url=${AERO_SUITE_STRIPE_CANCEL_URL:}
aero.suite.billing.pagarme.secret-key=${AERO_SUITE_PAGARME_SECRET_KEY:}
aero.suite.billing.pagarme.public-key=${AERO_SUITE_PAGARME_PUBLIC_KEY:}
aero.suite.billing.pagarme.webhook-secret=${AERO_SUITE_PAGARME_WEBHOOK_SECRET:}
aero.suite.billing.pagarme.base-url=${AERO_SUITE_PAGARME_BASE_URL:}
aero.suite.billing.pagarme.plan-id=${AERO_SUITE_PAGARME_PLAN_ID:}
aero.suite.billing.pagarme.amount-cents=${AERO_SUITE_PAGARME_AMOUNT_CENTS:9900}
aero.suite.billing.pagarme.plan-name=${AERO_SUITE_PAGARME_PLAN_NAME:Aero Suite Professional}
aero.suite.billing.pagarme.plan-interval=${AERO_SUITE_PAGARME_PLAN_INTERVAL:month}
aero.suite.billing.pagarme.success-url=${AERO_SUITE_PAGARME_SUCCESS_URL:}
aero.suite.billing.pagarme.cancel-url=${AERO_SUITE_PAGARME_CANCEL_URL:}

# LGPD: processamento assíncrono de solicitações
aero.suite.lgpd.processing.enabled=${AERO_SUITE_LGPD_PROCESSING_ENABLED:true}
aero.suite.lgpd.storage-dir=${AERO_SUITE_LGPD_STORAGE_DIR:lgpd-exports}

# Bling ERP — plataforma + OAuth por tenant
aero.suite.bling.enabled=${AERO_SUITE_BLING_ENABLED:false}
aero.suite.bling.api-base-url=${AERO_SUITE_BLING_API_BASE_URL:https://api.bling.com.br/Api/v3}
# Legado (Onda 1): token global; preferir OAuth por tenant
aero.suite.bling.access-token=${AERO_SUITE_BLING_ACCESS_TOKEN:}
aero.suite.bling.client-secret=${AERO_SUITE_BLING_CLIENT_SECRET:}
aero.suite.bling.oauth.client-id=${AERO_SUITE_BLING_CLIENT_ID:}
aero.suite.bling.oauth.client-secret=${AERO_SUITE_BLING_CLIENT_SECRET:}
aero.suite.bling.oauth.redirect-uri=${AERO_SUITE_BLING_REDIRECT_URI:}
aero.suite.bling.oauth.frontend-return-path=/integracoes/bling
aero.suite.bling.webhook.enabled=${AERO_SUITE_BLING_WEBHOOK_ENABLED:false}
aero.suite.bling.sync.enabled=${AERO_SUITE_BLING_SYNC_ENABLED:true}
# Cifra de tokens OAuth em repouso (32+ chars; produção: segredo dedicado)
aero.suite.secrets.key=${AERO_SUITE_SECRETS_KEY:}

# Auditoria de acesso
aero.suite.audit.enabled=${AERO_SUITE_AUDIT_ENABLED:true}

# Ambiente (opcional — banner UI + emissor TOTP). Omita ou defina AERO_SUITE_ENVIRONMENT_* no .env.
aero.suite.environment.name=${AERO_SUITE_ENVIRONMENT_NAME}
aero.suite.environment.kind=${AERO_SUITE_ENVIRONMENT_KIND}
aero.suite.platform.ops.mfa-issuer=${AERO_SUITE_PLATFORM_OPS_MFA_ISSUER}

# Plano de controle (infraestrutura SaaS) — login separado, allowlist de e-mails
aero.suite.platform.ops.allowed-emails=${PLATFORM_OPS_EMAILS:admin@aerosuite.com}
aero.suite.platform.ops.token-ttl-minutes=${PLATFORM_OPS_TOKEN_TTL_MINUTES:60}
aero.suite.platform.ops.mfa-required=${PLATFORM_OPS_MFA_REQUIRED:true}
aero.suite.platform.ops.mfa-revalidate-minutes=${PLATFORM_OPS_MFA_REVALIDATE_MINUTES:30}
